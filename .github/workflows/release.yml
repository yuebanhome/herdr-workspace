name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Validate tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as source:
              cargo_version = tomllib.load(source)["package"]["version"]
          with open("herdr-plugin.toml", "rb") as source:
              plugin_version = tomllib.load(source)["version"]

          expected_tag = f"v{cargo_version}"
          release_tag = os.environ["RELEASE_TAG"]
          if plugin_version != cargo_version:
              raise SystemExit(
                  f"manifest versions differ: Cargo={cargo_version}, plugin={plugin_version}"
              )
          if release_tag != expected_tag:
              raise SystemExit(f"tag {release_tag} must equal {expected_tag}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={cargo_version}\n")
          PY
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: bash -n scripts/open.sh scripts/package-release.sh tests/release_package.sh
      - run: bash tests/release_package.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package plugin bundle
        run: |
          scripts/package-release.sh \
            "${{ needs.validate.outputs.version }}" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/herdr-reporadar" \
            dist
      - name: Inspect package
        run: |
          test -x "target/${{ matrix.target }}/release/herdr-reporadar"
          file "target/${{ matrix.target }}/release/herdr-reporadar"
          tar -tzf "dist/herdr-reporadar-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Write release notes
        run: |
          printf '%s\n' \
            'Install from tagged source (requires Rust 1.88+):' \
            '' \
            '```bash' \
            "herdr plugin install yuebanhome/herdr-workspace --ref $RELEASE_TAG -y" \
            '```' \
            '' \
            'Prebuilt bundles and SHA-256 checksums are attached below. Extract the matching bundle and run `herdr plugin link <bundle>/herdr-reporadar --enabled`.' \
            > release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --verify-tag \
              --title "RepoRadar $RELEASE_TAG" \
              --generate-notes \
              --notes-file release-notes.md
          fi
