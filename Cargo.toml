[package]
name = "herdr-reporadar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A multi-repository change radar for Herdr workspaces"
license = "MIT"
repository = "https://github.com/yuebanhome/herdr-workspace"
keywords = ["herdr", "git", "tui", "workspace"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "herdr_reporadar"
path = "src/lib.rs"

[[bin]]
name = "herdr-reporadar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
ignore = "0.4"
ratatui = "0.30"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
